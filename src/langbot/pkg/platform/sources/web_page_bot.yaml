apiVersion: v1
kind: MessagePlatformAdapter
metadata:
  name: web_page_bot
  label:
    en_US: "Page Bot"
    zh_Hans: "页面机器人"
    zh_Hant: "頁面機器人"
    ja_JP: "ページボット"
    th_TH: "บอทหน้าเว็บ"
    vi_VN: "Bot trang web"
    es_ES: "Bot de página"
  description:
    en_US: "Embed a chat widget on any website with a simple script tag"
    zh_Hans: "通过一行脚本标签将聊天组件嵌入到任何网站"
    zh_Hant: "透過一行腳本標籤將聊天元件嵌入到任何網站"
    ja_JP: "シンプルなスクリプトタグで任意のウェブサイトにチャットウィジェットを埋め込みます"
    th_TH: "ฝังวิดเจ็ตแชทในเว็บไซต์ใดก็ได้ด้วยแท็กสคริปต์"
    vi_VN: "Nhúng widget trò chuyện vào bất kỳ trang web nào bằng thẻ script"
    es_ES: "Incrusta un widget de chat en cualquier sitio web con una etiqueta de script"
  icon: "webpage.webp"
spec:
  categories:
    - popular
  config:
    - name: title
      label:
        en_US: Widget Title
        zh_Hans: 组件标题
        zh_Hant: 元件標題
        ja_JP: ウィジェットタイトル
        th_TH: ชื่อวิดเจ็ต
        vi_VN: Tiêu đề widget
        es_ES: Título del widget
      description:
        en_US: The title displayed in the chat widget header
        zh_Hans: 显示在聊天组件顶部的标题
        zh_Hant: 顯示在聊天元件頂部的標題
        ja_JP: チャットウィジェットのヘッダーに表示されるタイトル
        th_TH: ชื่อที่แสดงในส่วนหัวของวิดเจ็ตแชท
        vi_VN: Tiêu đề hiển thị trong đầu widget trò chuyện
        es_ES: El título que se muestra en el encabezado del widget de chat
      type: string
      required: false
      default: "LangBot"
    - name: welcome_message
      label:
        en_US: "Welcome Message"
        zh_Hans: "欢迎语"
        zh_Hant: "歡迎語"
        ja_JP: "ウェルカムメッセージ"
        th_TH: "ข้อความต้อนรับ"
        vi_VN: "Lời chào"
        es_ES: "Mensaje de bienvenida"
        ru_RU: "Приветственное сообщение"
      description:
        en_US: "Text shown in the welcome area before the conversation starts. Leave empty to use the standalone page subtitle or the widget default."
        zh_Hans: "对话开始前显示在欢迎区的文字。留空则使用独立聊天页自带的副标题或组件默认文案。"
        zh_Hant: "對話開始前顯示在歡迎區的文字。留空則使用獨立聊天頁自帶的副標題或元件預設文案。"
        ja_JP: "会話開始前にウェルカムエリアへ表示するテキストです。空欄の場合は単独チャットページのサブタイトル、またはウィジェットの既定文言を使用します。"
        th_TH: "ข้อความที่แสดงในพื้นที่ต้อนรับก่อนเริ่มการสนทนา หากเว้นว่างจะใช้คำโปรยของหน้าแชทแบบสแตนด์อโลนหรือข้อความเริ่มต้นของวิดเจ็ต"
        vi_VN: "Văn bản hiển thị ở khu vực chào mừng trước khi cuộc trò chuyện bắt đầu. Để trống sẽ dùng phụ đề của trang trò chuyện độc lập hoặc văn bản mặc định của widget."
        es_ES: "Texto que se muestra en el área de bienvenida antes de iniciar la conversación. Si se deja vacío, se usa el subtítulo de la página de chat independiente o el texto predeterminado del widget."
        ru_RU: "Текст, отображаемый в приветственной области до начала разговора. Если оставить пустым, используется подзаголовок отдельной страницы чата или текст виджета по умолчанию."
      type: text
      required: false
      default: "你好，请问想了解什么？可以咨询招生报名、专业设置、校园服务等公开事项。"
    - name: bubble_icon
      label:
        en_US: Bubble Icon
        zh_Hans: 气泡图标
        zh_Hant: 氣泡圖示
        ja_JP: バブルアイコン
        th_TH: ไอคอนบับเบิล
        vi_VN: Biểu tượng bong bóng
        es_ES: Icono de burbuja
        ru_RU: Иконка пузырька
      description:
        en_US: "Icon displayed on the floating chat bubble"
        zh_Hans: "浮动聊天气泡上显示的图标"
      type: select
      required: false
      default: "logo"
      options:
        - name: "logo"
          label:
            en_US: "LangBot Logo"
            zh_Hans: "LangBot 图标"
        - name: "chat"
          label:
            en_US: "Chat Bubble"
            zh_Hans: "聊天气泡"
        - name: "robot"
          label:
            en_US: "Robot"
            zh_Hans: "机器人"
        - name: "headset"
          label:
            en_US: "Headset"
            zh_Hans: "客服耳机"
        - name: "sparkle"
          label:
            en_US: "Sparkle"
            zh_Hans: "星光"
        - name: "message"
          label:
            en_US: "Message"
            zh_Hans: "消息"
    - name: language
      label:
        en_US: Widget Language
        zh_Hans: 组件语言
        zh_Hant: 元件語言
        ja_JP: ウィジェット言語
        th_TH: ภาษาวิดเจ็ต
        vi_VN: Ngôn ngữ widget
        es_ES: Idioma del widget
        ru_RU: Язык виджета
      description:
        en_US: "Display language of the chat widget"
        zh_Hans: "聊天组件的显示语言"
        zh_Hant: "聊天元件的顯示語言"
        ja_JP: "チャットウィジェットの表示言語"
        th_TH: "ภาษาแสดงผลของวิดเจ็ตแชท"
        vi_VN: "Ngôn ngữ hiển thị của widget trò chuyện"
        es_ES: "Idioma de visualización del widget de chat"
        ru_RU: "Язык отображения виджета чата"
      type: select
      required: false
      default: "en_US"
      options:
        - name: "en_US"
          label:
            en_US: "English"
        - name: "zh_Hans"
          label:
            en_US: "简体中文"
        - name: "zh_Hant"
          label:
            en_US: "繁體中文"
        - name: "ja_JP"
          label:
            en_US: "日本語"
        - name: "es_ES"
          label:
            en_US: "Español"
        - name: "ru_RU"
          label:
            en_US: "Русский"
        - name: "th_TH"
          label:
            en_US: "ไทย"
        - name: "vi_VN"
          label:
            en_US: "Tiếng Việt"
    - name: quick_question_groups
      label:
        en_US: "Quick Question Groups"
        zh_Hans: "快捷提问分类"
        zh_Hant: "快捷提問分類"
        ja_JP: "質問候補のグループ"
        es_ES: "Grupos de preguntas rápidas"
        ru_RU: "Группы быстрых вопросов"
        th_TH: "กลุ่มคำถามด่วน"
        vi_VN: "Nhóm câu hỏi nhanh"
      description:
        en_US: "Plain-text quick question groups. Write one group name per line, then one question per line; separate groups with a blank line. Up to 6 groups, 12 questions per group, 200 characters per question. Leaving this empty configures no groups."
        zh_Hans: "以纯文本维护的快捷提问分类。每行写一个分类名，下面每行写一个问题；空一行分隔下一个分类。最多 6 个分类，每个分类最多 12 个问题，每题最多 200 个字符。留空表示不配置分类。"
        zh_Hant: "以純文字維護的快捷提問分類。每行寫一個分類名稱，下面每行寫一個問題；空一行分隔下一個分類。最多 6 個分類，每個分類最多 12 個問題，每題最多 200 個字元。留空表示不設定分類。"
        ja_JP: "テキストで入力する質問候補のグループです。グループ名を1行に1つ、その下に質問を1行に1つ入力し、空行で次のグループを区切ります。最大6グループ、各グループ12件、1件200文字までです。空欄の場合はグループを設定しません。"
        es_ES: "Grupos de preguntas rápidas en texto plano. Escribe un nombre de grupo por línea y, debajo, una pregunta por línea; separa los grupos con una línea en blanco. Máximo 6 grupos, 12 preguntas por grupo y 200 caracteres por pregunta. Si lo dejas vacío, no se configura ningún grupo."
        ru_RU: "Группы быстрых вопросов в виде обычного текста. Укажите название группы на отдельной строке, ниже — по одному вопросу в строке; группы разделяйте пустой строкой. Не более 6 групп, 12 вопросов в группе и 200 символов в вопросе. Пустое поле означает, что группы не настроены."
        th_TH: "กลุ่มคำถามด่วนในรูปแบบข้อความล้วน เขียนชื่อกลุ่มหนึ่งบรรทัด จากนั้นเขียนคำถามบรรทัดละหนึ่งข้อ และเว้นบรรทัดว่างเพื่อแยกกลุ่มถัดไป ตั้งได้สูงสุด 6 กลุ่ม กลุ่มละ 12 คำถาม และคำถามละไม่เกิน 200 ตัวอักษร หากเว้นว่างจะไม่ตั้งค่ากลุ่ม"
        vi_VN: "Nhóm câu hỏi nhanh dạng văn bản thuần. Mỗi dòng ghi một tên nhóm, bên dưới mỗi dòng ghi một câu hỏi; dùng dòng trống để phân cách các nhóm. Tối đa 6 nhóm, 12 câu mỗi nhóm và 200 ký tự mỗi câu. Để trống nếu không cấu hình nhóm nào."
      type: quick-question-groups
      required: false
      default: []
    - name: embed_code
      label:
        en_US: Embed Code
        zh_Hans: 嵌入代码
        zh_Hant: 嵌入代碼
        ja_JP: 埋め込みコード
        th_TH: โค้ดฝังตัว
        vi_VN: Mã nhúng
        es_ES: Código de incrustación
      description:
        en_US: "Copy this code and paste it into your website HTML. The code will be generated after saving."
        zh_Hans: "复制此代码并粘贴到你的网站 HTML 中。保存后将自动生成。"
        zh_Hant: "複製此代碼並貼到你的網站 HTML 中。儲存後將自動生成。"
        ja_JP: "このコードをコピーしてウェブサイトのHTMLに貼り付けてください。保存後に自動生成されます。"
        th_TH: "คัดลอกโค้ดนี้และวางในHTML ของเว็บไซต์ของคุณ จะสร้างอัตโนมัติหลังจากบันทึก"
        vi_VN: "Sao chép mã này và dán vào HTML trang web của bạn. Mã sẽ được tạo tự động sau khi lưu."
        es_ES: "Copia este código y pégalo en el HTML de tu sitio web. El código se generará después de guardar."
      type: embed-code
      required: false
      default: ""
    - name: turnstile_site_key
      label:
        en_US: Turnstile Site Key
        zh_Hans: Turnstile 站点密钥
      description:
        en_US: "Cloudflare Turnstile site key for bot protection. Get it from the Cloudflare dashboard (Turnstile > Add Site). Leave empty to disable."
        zh_Hans: "Cloudflare Turnstile 站点密钥，用于防止机器人滥用。在 Cloudflare 控制台（Turnstile > 添加站点）中获取。留空则不启用。"
      type: string
      required: false
      default: ""
    - name: turnstile_secret_key
      label:
        en_US: Turnstile Secret Key
        zh_Hans: Turnstile 服务端密钥
      description:
        en_US: "Cloudflare Turnstile secret key for server-side token verification. Found alongside the site key in the Cloudflare dashboard. Required if site key is set."
        zh_Hans: "Cloudflare Turnstile 服务端密钥，用于服务端验证令牌。与站点密钥一起在 Cloudflare 控制台中获取。设置了站点密钥时必填。"
      type: string
      required: false
      default: ""
execution:
  python:
    path: "web_page_bot_adapter.py"
    attr: "WebPageBotAdapter"
