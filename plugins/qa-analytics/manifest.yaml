apiVersion: langbot/v1
kind: Plugin
metadata:
  author: langbot-team
  name: qa-analytics
  version: 0.1.2
  label:
    en_US: Q&A Analytics
    zh_Hans: 咨询问答看板
    zh_Hant: 諮詢問答看板
    ja_JP: Q&A 分析
    es_ES: Análisis de preguntas
    ru_RU: Аналитика вопросов
    th_TH: แดชบอร์ดคำถาม
    vi_VN: Bảng phân tích hỏi đáp
  description:
    en_US: Knowledge-base Q&A analytics and visitor message board for the current Workspace.
    zh_Hans: 查看当前 Workspace 的知识库咨询问答统计与访客留言。
    zh_Hant: 查看目前 Workspace 的知識庫諮詢問答統計與訪客留言。
    ja_JP: 現在の Workspace のナレッジベース Q&A 統計と訪問者メッセージを表示します。
    es_ES: Estadísticas de preguntas y respuestas y mensajes de visitantes del Workspace actual.
    ru_RU: Статистика вопросов и ответов и сообщения посетителей текущего Workspace.
    th_TH: สถิติคำถามและคำตอบและข้อความจากผู้เข้าชมของ Workspace ปัจจุบัน
    vi_VN: Thống kê hỏi đáp và tin nhắn khách truy cập của Workspace hiện tại.
  icon: assets/icon.svg
spec:
  version: 0.1.2
  config: []
  components:
    Page:
      fromDirs:
        - path: components/pages/
execution:
  python:
    path: main.py
    attr: QAAnalyticsPlugin
