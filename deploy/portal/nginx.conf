# Public gateway for the application center.
#
# Browsers open this gateway on the old LangBot port. Everything except
# /sqlbot/ is forwarded to LangBot; /sqlbot/ keeps its prefix because SqlBot
# runs with CONTEXT_PATH=/sqlbot and mounts its own SPA and API below it.
#
# The upstream names are compose service names, resolved through Docker's
# embedded DNS at request time so recreating a backend does not require
# restarting the gateway.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Never write query strings to the access log: they can carry one-time
# credentials on endpoints other than the SqlBot handoff.
log_format portal '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log portal;

    client_max_body_size 200m;
    client_body_timeout 300s;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $langbot_backend "langbot:5300";
    set $sqlbot_backend "sqlbot:8000";

    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-to-server ticket endpoint. LangBot calls SqlBot directly over the
    # compose network; this path must never be reachable from a browser.
    location = /sqlbot/api/v1/system/langbot/sso/ticket {
        return 404;
    }
    location ^~ /sqlbot/api/v1/system/langbot/sso/ticket/ {
        return 404;
    }

    # API documentation stays internal.
    location ^~ /sqlbot/docs {
        return 404;
    }
    location ^~ /sqlbot/redoc {
        return 404;
    }
    location = /sqlbot/openapi.json {
        return 404;
    }

    # Relative asset URLs require the trailing slash before the SPA loads.
    location = /sqlbot {
        return 308 /sqlbot/;
    }

    location ^~ /sqlbot/ {
        proxy_pass http://$sqlbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE chat streaming and large Excel uploads/downloads.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_redirect http://$sqlbot_backend/ /sqlbot/;
    }

    location / {
        proxy_pass http://$langbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_redirect http://$langbot_backend/ /;
    }
}
