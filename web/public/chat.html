<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>广东岭南职业技术学院公共咨询机器人</title>
  <!--
    Page-level configuration for the standalone chat widget.

    Everything below can be overridden without editing this file:
      ?embed=<bot uuid>   talk to a different page bot
      ?title=<text>       header and tab title
      ?theme=%23RRGGBB    accent color
      ?config=<url>       load a JSON file with the same fields

    Quick question tabs come only from the bot's saved "quick question
    groups" configuration. Pages no longer define fallback roles; a bot with
    no groups shows the plain welcome screen.

    The "links" array powers the top-right quick link navigation. It is read
    by the page script below, not by chat-shell.js, so ?config= and the URL
    parameters above do not override it; edit this block to change the menu.
    Only absolute http(s) URLs are rendered.
  -->
  <script type="application/json" id="chat-config">
  {
    "bot": "9da8c6a6-b4cc-4922-b23d-3fa015ed85e4",
    "title": "广东岭南职业技术学院公共咨询机器人",
    "subtitle": "你好，请问想了解什么？可以咨询招生、新生报到、校友服务、教师交流和来校访问等公开事项。",
    "accent": "#72030C",
    "accentHover": "#932020",
    "accentBorder": "#E0BFBC",
    "logo": "/brand/lingnan-logo-symbol.png",
    "links": [
      { "label": "广州校区VR全景", "url": "https://www.720yun.com/vr/89cjtgkkrw7?s=19327510" },
      { "label": "清远校区VR全景", "url": "https://www.720yun.com/vr/408jtgkkuO1?s=19217486" },
      { "label": "录取查询", "url": "https://lnc.edu.cn/zsw/xszn/lqcxl" },
      { "label": "招生计划", "url": "https://lnc.edu.cn/zsw/zsjh/byaejbejqq" },
      { "label": "招生简章", "url": "https://lnc.edu.cn/zsw/zsjz/2021nzsjz" },
      { "label": "新生指南", "url": "https://lnc.edu.cn/zsw/xszn/jtzn" }
    ]
  }
  </script>
  <script src="/chat-shell.js"></script>
  <style>
    /* On phones the tools become a bottom action bar. chat-shell.js reads the
       reserve from here to keep the chat panel above the bar; the composer
       does not add the safe-area inset twice because the bar already owns it. */
    html {
      --lb-tools-reserve: calc(64px + env(safe-area-inset-bottom));
      --lb-composer-safe-bottom: 0px;
    }
    /* Top-right tools: quick link navigation and the message board. The
       message board keeps its original right offset (88px desktop / 80px
       narrow), so the quick link button sits to its left without touching the
       widget's own reset/close actions. The message board styles stay in sync
       with chat-jishi.html; the quick link block is chat.html only for now. */
    #ln-consult-tools {
      position: fixed;
      top: 16px;
      right: 88px;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ln-consult-tools[hidden] { display: none; }
    #ln-quick-nav { position: relative; }
    #ln-quick-nav[hidden] { display: none; }
    .ln-quick-label-short { display: none; }
    #ln-quick-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid #E0BFBC;
      border-radius: 999px;
      background: #fff;
      color: #72030C;
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #ln-quick-toggle:hover { background: #FFF6F5; border-color: #932020; }
    #ln-quick-toggle[aria-expanded="true"] { background: #FFF1EF; border-color: #932020; }
    #ln-quick-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .ln-quick-caret {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      transition: transform 0.15s ease;
    }
    #ln-quick-toggle[aria-expanded="true"] .ln-quick-caret { transform: rotate(180deg); }
    #ln-quick-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 252px;
      max-width: calc(100vw - 24px);
      max-height: min(calc(100dvh - 80px), 420px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      border: 1px solid #E0BFBC;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }
    #ln-quick-menu[hidden] { display: none; }
    #ln-quick-menu:not([hidden]) { animation: ln-quick-drop 0.14s ease-out; }
    @keyframes ln-quick-drop {
      from { opacity: 0; transform: translateY(-4px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    .ln-quick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #111827;
      font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-decoration: none;
    }
    .ln-quick-item:hover { background: #FDF2F1; }
    .ln-quick-item:active { background: #FBE5E3; }
    .ln-quick-item:focus-visible {
      outline: none;
      background: #FDF2F1;
      box-shadow: inset 0 0 0 2px #72030C;
    }
    .ln-quick-icon {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #F7E9E8;
      color: #72030C;
      font-size: 13px;
      font-weight: 700;
    }
    .ln-quick-item:nth-child(6n+2) .ln-quick-icon { background: #E8F1FB; color: #1D4ED8; }
    .ln-quick-item:nth-child(6n+3) .ln-quick-icon { background: #E7F6EF; color: #0F766E; }
    .ln-quick-item:nth-child(6n+4) .ln-quick-icon { background: #FDF1E3; color: #B45309; }
    .ln-quick-item:nth-child(6n+5) .ln-quick-icon { background: #F1ECFE; color: #6D28D9; }
    .ln-quick-item:nth-child(6n) .ln-quick-icon { background: #FDECEF; color: #BE123C; }
    .ln-quick-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ln-quick-ext { flex-shrink: 0; color: #9CA3AF; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      #ln-quick-menu:not([hidden]) { animation: none; }
      .ln-quick-caret { transition: none; }
    }
    #ln-consult-launcher {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: #72030C;
      color: #fff;
      font: 600 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      -webkit-tap-highlight-color: transparent;
    }
    /* The launcher stays hidden until the widget script exposes the bot uuid.
       Reserving its width avoids shifting the quick link button on load. */
    #ln-consult-launcher[hidden] {
      display: inline-flex;
      visibility: hidden;
      pointer-events: none;
    }
    #ln-consult-launcher:hover { filter: brightness(1.12); }
    #ln-consult-launcher:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #ln-consult-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(17, 24, 39, 0.5);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    #ln-consult-overlay[hidden] { display: none; }
    #ln-consult-dialog {
      width: min(440px, 100%);
      max-height: 90dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px;
      border-radius: 14px;
      background: #fff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    /* The dialog renders outside the host page's reset styles, so scope
       border-box here; otherwise 100%-wide inputs add their padding and
       border on top of the content width and touch the right edge. */
    #ln-consult-dialog,
    #ln-consult-dialog *,
    #ln-consult-dialog *::before,
    #ln-consult-dialog *::after { box-sizing: border-box; }
    #ln-consult-dialog h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; color: #111827; }
    #ln-consult-hint { margin: 0 0 4px; font-size: 13px; line-height: 1.6; color: #4b5563; }
    .ln-consult-field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
    .ln-consult-field label { font-size: 13px; font-weight: 600; color: #374151; }
    .ln-consult-field input {
      display: block;
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #111827;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .ln-consult-field input:focus {
      border-color: #72030C;
      box-shadow: 0 0 0 3px rgba(114, 3, 12, 0.14);
    }
    #ln-consult-message { min-height: 18px; margin-top: 12px; font-size: 13px; line-height: 1.5; color: #4b5563; }
    #ln-consult-message.error { color: #b91c1c; }
    #ln-consult-message.success { color: #166534; }
    .ln-consult-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .ln-consult-btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }
    .ln-consult-btn:hover { filter: brightness(0.97); }
    .ln-consult-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(114, 3, 12, 0.25); }
    .ln-consult-btn.secondary { border: 1px solid #d1d5db; background: #f3f4f6; color: #374151; }
    .ln-consult-btn.primary { border: 1px solid #72030C; background: #72030C; color: #fff; }
    .ln-consult-btn.primary:disabled { opacity: 0.65; cursor: default; filter: none; }
    @media (max-width: 480px) {
      /* The toolbar moves below the composer so it no longer covers the chat
         title or the widget's reset/minimize buttons. Both actions stay
         visible, thumb-sized, and include the home-indicator safe area. */
      #ln-consult-tools {
        top: auto;
        left: 0;
        right: 0;
        /* Lift the bar above mobile browser chrome too, matching the panel. */
        bottom: var(--lb-vv-bottom, 0px);
        height: var(--lb-tools-reserve);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        justify-content: center;
        gap: 10px;
        box-sizing: border-box;
        background: #fff;
        border-top: 1px solid #ececec;
      }
      /* The keyboard covers the bar; hiding it also frees its reserved space
         so the composer sits directly on top of the keyboard. */
      html.lb-keyboard-open #ln-consult-tools { display: none; }
      #ln-quick-nav { flex: 1 1 0; max-width: 170px; }
      #ln-quick-toggle {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        justify-content: center;
        font-size: 14px;
      }
      .ln-quick-label-full { display: inline; }
      .ln-quick-label-short { display: none; }
      #ln-consult-launcher {
        flex: 1 1 0;
        max-width: 170px;
        min-height: 44px;
        padding: 10px 14px;
        justify-content: center;
        font-size: 14px;
      }
      /* Above the bar and anchored to both screen edges: the old top-right
         menu would now open off-screen. */
      #ln-quick-menu {
        position: fixed;
        top: auto;
        left: 12px;
        right: 12px;
        bottom: calc(var(--lb-vv-bottom, 0px) + var(--lb-tools-reserve) + 8px);
        width: auto;
        max-width: none;
        max-height: min(60dvh, 420px);
      }
      /* Keep the message-board dialog inside the visual viewport so focusing
         an input never pushes the Save button under the keyboard. */
      #ln-consult-overlay {
        top: var(--lb-vv-top, 0px);
        height: var(--lb-vv-height, 100dvh);
        bottom: auto;
        box-sizing: border-box;
        padding: calc(12px + env(safe-area-inset-top)) 12px
                 calc(12px + env(safe-area-inset-bottom));
      }
      #ln-consult-dialog {
        width: 100%;
        max-height: calc(
          var(--lb-vv-height, 100dvh) - 24px -
          env(safe-area-inset-top) - env(safe-area-inset-bottom)
        );
        padding: 18px;
      }
      .ln-consult-field input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="ln-consult-tools">
    <div id="ln-quick-nav" hidden>
      <button type="button" id="ln-quick-toggle"
              aria-haspopup="menu" aria-expanded="false"
              aria-controls="ln-quick-menu" aria-label="快捷链接导航">
        <span class="ln-quick-label-full" aria-hidden="true">快捷链接导航</span>
        <span class="ln-quick-label-short" aria-hidden="true">快捷链接</span>
        <span class="ln-quick-caret" aria-hidden="true"></span>
      </button>
      <div id="ln-quick-menu" role="menu" aria-labelledby="ln-quick-toggle" hidden></div>
    </div>
    <button type="button" id="ln-consult-launcher" hidden>留言板</button>
  </div>
  <div id="ln-consult-overlay" hidden>
    <div id="ln-consult-dialog" role="dialog" aria-modal="true" aria-labelledby="ln-consult-title">
      <h2 id="ln-consult-title">留言板</h2>
      <p id="ln-consult-hint">提交后招生办老师根据您的信息提供更加详细的院校和专业建议。</p>
      <form id="ln-consult-form" novalidate>
        <div class="ln-consult-field">
          <label for="ln-consult-province">所在省市</label>
          <input id="ln-consult-province" name="province" type="text" maxlength="64" autocomplete="address-level1" required>
        </div>
        <div class="ln-consult-field">
          <label for="ln-consult-city">所在城市</label>
          <input id="ln-consult-city" name="city" type="text" maxlength="64" autocomplete="address-level2" required>
        </div>
        <div class="ln-consult-field">
          <label for="ln-consult-name">姓名</label>
          <input id="ln-consult-name" name="name" type="text" maxlength="128" autocomplete="name" required>
        </div>
        <div class="ln-consult-field">
          <label for="ln-consult-score">分数</label>
          <input id="ln-consult-score" name="score" type="text" inputmode="decimal" maxlength="32" required>
        </div>
        <div class="ln-consult-field">
          <label for="ln-consult-contact">联系方式</label>
          <input id="ln-consult-contact" name="contact" type="text" maxlength="255" inputmode="tel" autocomplete="tel" required>
        </div>
        <p id="ln-consult-message" role="status" aria-live="polite"></p>
        <div class="ln-consult-actions">
          <button type="button" class="ln-consult-btn secondary" id="ln-consult-close">关闭</button>
          <button type="submit" class="ln-consult-btn primary" id="ln-consult-save">保存</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      // The widget script is the source of truth: chat-shell applies ?embed=
      // and remote config overrides before it injects the script tag.
      var BOT_PATTERN = /\/api\/v1\/embed\/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})\/widget\.js/;
      var SUCCESS_TEXT = '提交成功，招生办老师将尽快与您联系';
      var REQUIRED_TEXT = '请填写所有必填项。';
      var GENERIC_ERROR_TEXT = '提交失败，请稍后重试。';
      var NETWORK_ERROR_TEXT = '网络异常，请稍后重试。';

      var tools = document.getElementById('ln-consult-tools');
      var quickNav = document.getElementById('ln-quick-nav');
      var quickToggle = document.getElementById('ln-quick-toggle');
      var quickMenu = document.getElementById('ln-quick-menu');
      var launcher = document.getElementById('ln-consult-launcher');
      var overlay = document.getElementById('ln-consult-overlay');
      var form = document.getElementById('ln-consult-form');
      var saveButton = document.getElementById('ln-consult-save');
      var closeButton = document.getElementById('ln-consult-close');
      var messageNode = document.getElementById('ln-consult-message');
      var provinceInput = document.getElementById('ln-consult-province');
      var cityInput = document.getElementById('ln-consult-city');
      var nameInput = document.getElementById('ln-consult-name');
      var scoreInput = document.getElementById('ln-consult-score');
      var contactInput = document.getElementById('ln-consult-contact');

      var botUuid = '';
      var submitting = false;
      var lastFocus = null;
      var previousBodyOverflow = '';
      var closeTimer = null;
      var quickOpen = false;
      var quickOpenTimer = null;
      var quickCloseTimer = null;

      // Quick links live in the same inline #chat-config block as the brand
      // fields, but only this script reads them: chat-shell ignores the
      // unknown key, so ?config= and URL parameters never override them.
      function readQuickLinks() {
        var node = document.getElementById('chat-config');
        var links = [];
        if (!node) return links;
        var config;
        try {
          config = JSON.parse(node.textContent);
        } catch (error) {
          return links;
        }
        if (!config || !Array.isArray(config.links)) return links;
        for (var i = 0; i < config.links.length; i++) {
          var entry = config.links[i];
          if (!entry || typeof entry.label !== 'string' || typeof entry.url !== 'string') continue;
          var label = entry.label.replace(/^\s+|\s+$/g, '');
          var rawUrl = entry.url.replace(/^\s+|\s+$/g, '');
          if (!label || !rawUrl) continue;
          // Parse without a base: relative paths, //host and non-http(s)
          // schemes all fail the protocol check and are skipped silently.
          var parsed;
          try {
            parsed = new URL(rawUrl);
          } catch (error) {
            continue;
          }
          if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') continue;
          links.push({ label: label.slice(0, 48), url: parsed.href });
        }
        return links;
      }

      function createQuickItem(link) {
        var item = document.createElement('a');
        item.className = 'ln-quick-item';
        item.href = link.url;
        item.target = '_blank';
        item.rel = 'noopener noreferrer';
        item.setAttribute('role', 'menuitem');
        item.tabIndex = -1;

        var icon = document.createElement('span');
        icon.className = 'ln-quick-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = Array.from(link.label)[0] || '链';

        var text = document.createElement('span');
        text.className = 'ln-quick-text';
        text.textContent = link.label;

        var ext = document.createElement('span');
        ext.className = 'ln-quick-ext';
        ext.setAttribute('aria-hidden', 'true');
        ext.textContent = '↗';

        item.appendChild(icon);
        item.appendChild(text);
        item.appendChild(ext);
        item.addEventListener('click', function () { closeQuickMenu(false); });
        return item;
      }

      function renderQuickLinks() {
        var links = readQuickLinks();
        if (!links.length) return;
        for (var i = 0; i < links.length; i++) {
          quickMenu.appendChild(createQuickItem(links[i]));
        }
        quickNav.hidden = false;
      }

      // The page-level tools belong to the chat view. When the visitor closes
      // the widget with its floating close button, hide them too instead of
      // leaving two buttons over a blank page; reopening from the bubble
      // brings them back. If widget.js never loads, no panel appears and the
      // quick links stay available on their own.
      function attachPanelWatcher(panel) {
        function sync() {
          var visible = panel.classList.contains('lb-visible');
          tools.hidden = !visible;
          if (!visible) closeQuickMenu(false);
        }
        sync();
        if (typeof MutationObserver === 'function') {
          new MutationObserver(sync).observe(panel, {
            attributes: true,
            attributeFilter: ['class']
          });
        }
      }

      function watchWidgetPanel() {
        var tries = 0;
        function findPanel() {
          var root = document.getElementById('langbot-widget-root');
          return root && root.shadowRoot ? root.shadowRoot.querySelector('.lb-panel') : null;
        }
        function retry() {
          var panel = findPanel();
          if (panel) {
            attachPanelWatcher(panel);
            return;
          }
          if (++tries > 150) return;
          window.setTimeout(retry, 100);
        }
        retry();
      }

      function clearQuickTimers() {
        if (quickOpenTimer) {
          window.clearTimeout(quickOpenTimer);
          quickOpenTimer = null;
        }
        if (quickCloseTimer) {
          window.clearTimeout(quickCloseTimer);
          quickCloseTimer = null;
        }
      }

      function focusQuickItem(index) {
        var items = quickMenu.children;
        if (!items.length) return;
        if (index < 0) index = items.length - 1;
        if (index >= items.length) index = 0;
        items[index].focus();
      }

      function openQuickMenu() {
        clearQuickTimers();
        if (quickOpen) return;
        quickOpen = true;
        quickMenu.hidden = false;
        quickToggle.setAttribute('aria-expanded', 'true');
      }

      function closeQuickMenu(restoreFocus) {
        clearQuickTimers();
        if (!quickOpen) return;
        quickOpen = false;
        quickMenu.hidden = true;
        quickToggle.setAttribute('aria-expanded', 'false');
        if (restoreFocus) quickToggle.focus();
      }

      function findBotUuid() {
        var scripts = document.querySelectorAll('script[src*="/api/v1/embed/"]');
        for (var i = 0; i < scripts.length; i++) {
          var match = (scripts[i].getAttribute('src') || '').match(BOT_PATTERN);
          if (match) return match[1];
        }
        return '';
      }

      function enableLauncher(uuid) {
        if (!uuid) return false;
        botUuid = uuid;
        launcher.hidden = false;
        return true;
      }

      function setMessage(text, kind) {
        messageNode.textContent = text || '';
        messageNode.className = kind || '';
      }

      function fieldValue(input) {
        return input.value.replace(/^\s+|\s+$/g, '');
      }

      function focusField(input) {
        input.focus();
      }

      function resetSubmitState() {
        submitting = false;
        saveButton.disabled = false;
        saveButton.textContent = '保存';
      }

      function openModal() {
        if (!botUuid) return;
        closeQuickMenu(false);
        if (closeTimer) {
          window.clearTimeout(closeTimer);
          closeTimer = null;
        }
        resetSubmitState();
        setMessage('', '');
        lastFocus = document.activeElement;
        previousBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        overlay.hidden = false;
        focusField(provinceInput);
      }

      function closeModal() {
        if (overlay.hidden) return;
        if (closeTimer) {
          window.clearTimeout(closeTimer);
          closeTimer = null;
        }
        overlay.hidden = true;
        document.body.style.overflow = previousBodyOverflow;
        resetSubmitState();
        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
      }

      function collectPayload() {
        return {
          province: fieldValue(provinceInput),
          city: fieldValue(cityInput),
          name: fieldValue(nameInput),
          score: fieldValue(scoreInput),
          contact: fieldValue(contactInput)
        };
      }

      function validate(payload) {
        var fields = [
          ['province', provinceInput],
          ['city', cityInput],
          ['name', nameInput],
          ['score', scoreInput],
          ['contact', contactInput]
        ];
        for (var i = 0; i < fields.length; i++) {
          if (!payload[fields[i][0]]) {
            setMessage(REQUIRED_TEXT, 'error');
            focusField(fields[i][1]);
            return false;
          }
        }
        return true;
      }

      function clearFields() {
        provinceInput.value = '';
        cityInput.value = '';
        nameInput.value = '';
        scoreInput.value = '';
        contactInput.value = '';
      }

      function submitPayload() {
        if (submitting || !botUuid) return;
        setMessage('', '');
        var payload = collectPayload();
        if (!validate(payload)) return;

        submitting = true;
        saveButton.disabled = true;
        saveButton.textContent = '提交中…';

        fetch('/api/v1/embed/' + encodeURIComponent(botUuid) + '/consult-messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function (response) {
          return response.json().catch(function () { return null; }).then(function (body) {
            return { ok: response.ok, body: body };
          });
        }).then(function (result) {
          if (result.ok && result.body && result.body.code === 0) {
            setMessage(SUCCESS_TEXT, 'success');
            clearFields();
            saveButton.disabled = true;
            saveButton.textContent = '已提交';
            closeTimer = window.setTimeout(closeModal, 1000);
            return;
          }
          var serverMessage = result.body && typeof result.body.msg === 'string' ? result.body.msg : '';
          setMessage(serverMessage || GENERIC_ERROR_TEXT, 'error');
          resetSubmitState();
        }).catch(function () {
          setMessage(NETWORK_ERROR_TEXT, 'error');
          resetSubmitState();
        });
      }

      // Hover opens the menu, but touch has no hover: pointerType tells them
      // apart so a tap only goes through the click toggle and never double
      // fires. Leaving gets a short grace period to cross the 8px gap into
      // the menu without the menu flickering shut.
      quickNav.addEventListener('pointerenter', function (event) {
        if (event.pointerType === 'touch') return;
        clearQuickTimers();
        if (quickOpen) return;
        quickOpenTimer = window.setTimeout(function () {
          quickOpenTimer = null;
          openQuickMenu();
        }, 100);
      });
      quickNav.addEventListener('pointerleave', function (event) {
        if (event.pointerType === 'touch') return;
        clearQuickTimers();
        quickCloseTimer = window.setTimeout(function () {
          quickCloseTimer = null;
          if (quickNav.contains(document.activeElement)) return;
          closeQuickMenu(false);
        }, 200);
      });
      quickMenu.addEventListener('pointerenter', function () {
        if (quickCloseTimer) {
          window.clearTimeout(quickCloseTimer);
          quickCloseTimer = null;
        }
      });

      quickToggle.addEventListener('click', function () {
        if (quickOpen) closeQuickMenu(false);
        else openQuickMenu();
      });
      quickToggle.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          openQuickMenu();
          focusQuickItem(0);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          openQuickMenu();
          focusQuickItem(-1);
        } else if (event.key === 'Escape' && quickOpen) {
          event.preventDefault();
          closeQuickMenu(true);
        }
      });
      quickMenu.addEventListener('keydown', function (event) {
        var index = Array.prototype.indexOf.call(quickMenu.children, document.activeElement);
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          focusQuickItem(index + 1);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          focusQuickItem(index - 1);
        } else if (event.key === 'Home') {
          event.preventDefault();
          focusQuickItem(0);
        } else if (event.key === 'End') {
          event.preventDefault();
          focusQuickItem(-1);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          closeQuickMenu(true);
        }
      });

      document.addEventListener('pointerdown', function (event) {
        if (!quickOpen || tools.contains(event.target)) return;
        closeQuickMenu(false);
      }, true);
      tools.addEventListener('focusout', function () {
        if (!quickOpen) return;
        window.setTimeout(function () {
          if (!quickOpen || tools.contains(document.activeElement)) return;
          closeQuickMenu(false);
        }, 0);
      });
      window.addEventListener('resize', function () {
        if (quickOpen) closeQuickMenu(false);
      });
      // Opening the keyboard hides the bottom bar and its menu; close the menu
      // state too so it does not reappear open when the keyboard goes away.
      if (window.visualViewport) {
        var lastViewportHeight = window.visualViewport.height;
        window.visualViewport.addEventListener('resize', function () {
          var height = window.visualViewport.height;
          if (lastViewportHeight - height > 120 && quickOpen) {
            closeQuickMenu(false);
          }
          lastViewportHeight = height;
        });
      }

      launcher.addEventListener('click', openModal);
      closeButton.addEventListener('click', closeModal);
      overlay.addEventListener('click', function (event) {
        if (event.target === overlay) closeModal();
      });
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitPayload();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        if (!overlay.hidden) {
          closeModal();
          return;
        }
        if (quickOpen) closeQuickMenu(true);
      });

      // Quick links do not depend on the bot: render them immediately even if
      // widget.js fails to load and the message board stays hidden.
      renderQuickLinks();
      watchWidgetPanel();

      if (!enableLauncher(findBotUuid())) {
        var observer = new MutationObserver(function () {
          if (enableLauncher(findBotUuid())) observer.disconnect();
        });
        observer.observe(document.head, { childList: true });
        window.setTimeout(function () { observer.disconnect(); }, 15000);
      }
    })();
  </script>
</body>
</html>
