<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能咨询</title>
  <script>
    // Standalone chat page: loads the LangBot embed widget and expands it to
    // the full viewport. Vite copies web/public into web/dist, so the core
    // serves this file at /chat.html and the widget URL stays same-origin --
    // no host or scheme needs to be hard-coded.
    //
    // Query parameters:
    //   embed=<bot uuid>  which bot to talk to
    //   title=<text>      label shown in the widget header and the tab title
    (function () {
      var DEFAULT_BOT_UUID = '9da8c6a6-b4cc-4922-b23d-3fa015ed85e4';
      var DEFAULT_TITLE = '测试公共咨询机器人';

      var params = new URLSearchParams(window.location.search);
      var botUuid = params.get('embed') || DEFAULT_BOT_UUID;
      var title = params.get('title') || DEFAULT_TITLE;

      document.title = title;

      var script = document.createElement('script');
      script.src = '/api/v1/embed/' + encodeURIComponent(botUuid) + '/widget.js';
      script.setAttribute('data-title', title);
      // The page has no content of its own, so an unopened panel would leave
      // the visitor staring at a blank screen.
      script.setAttribute('data-auto-open', 'true');
      document.head.appendChild(script);
    })();

    // The widget renders inside a Shadow DOM, so a plain <style> here cannot
    // reach its panel. Append an override stylesheet to the widget's shadow
    // root instead; it lands after the widget's own styles and wins on equal
    // specificity.
    (function () {
      // Height reserved at the bottom for the launcher bubble: 20px offset +
      // 56px bubble. Adjust to change the gap under the panel.
      var BUBBLE_RESERVED = 76;

      var OVERRIDE_CSS =
        '.lb-panel {' +
        '  left: 0;' +
        '  right: 0;' +
        '  width: auto;' +                                           // override width: 400px
        '  bottom: ' + BUBBLE_RESERVED + 'px;' +
        '  height: calc(100vh - ' + BUBBLE_RESERVED + 'px);' +
        '  max-height: calc(100vh - ' + BUBBLE_RESERVED + 'px);' +  // override max-height: calc(100vh - 108px)
        '  border-radius: 0;' +
        '}';

      function apply() {
        var root = document.getElementById('langbot-widget-root');
        if (!root || !root.shadowRoot) return false;
        if (root.shadowRoot.querySelector('style[data-layout-override]')) return true;
        var style = document.createElement('style');
        style.setAttribute('data-layout-override', '');
        style.textContent = OVERRIDE_CSS;
        root.shadowRoot.appendChild(style);
        return true;
      }

      if (apply()) return;

      // The widget script is injected asynchronously and builds its root on
      // DOMContentLoaded. Listen first, then poll as a fallback for the case
      // where the root appears after that event.
      document.addEventListener('DOMContentLoaded', apply);
      var tries = 0;
      var timer = setInterval(function () {
        if (apply() || ++tries > 100) clearInterval(timer);
      }, 50);
    })();
  </script>
</head>
<body>

</body>
</html>
